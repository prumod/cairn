<!--

  Três variantes do seletor de locais, trocadas com #a, #b, #c ou com a barra inferior.

<style>
  /* Layout: barra de filtros em cima, tabela de lotes e painel de estado; o seletor de locais muda por variante. */
  :root {
    --canvas: #edf0f4;
    --panel: #fff;
    --panel2: #f1f4f8;
    --line: #d3dae3;
    --fg: #17202b;
    --muted: #566474;
    --accent: #1d5fd6;
    --onaccent: #fff;
    --amber: #b45309;
    --accentSoft: #e4edfc;
    --amberSoft: #fbebd7;
    --danger: #b42318;
    --shadow: rgba(23, 32, 43, 0.18);
    --proto: #2b1d4a;
    --onproto: #f3eefe;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --canvas: #06080b;
      --panel: #121923;
      --panel2: #1a222e;
      --line: #2a3646;
      --fg: #e1e8f0;
      --muted: #8e9cae;
      --accent: #5ba8f5;
      --onaccent: #04121f;
      --amber: #f5b041;
      --accentSoft: #142538;
      --amberSoft: #33270f;
      --danger: #f2706a;
      --shadow: rgba(0, 0, 0, 0.6);
      --proto: #e9e0ff;
      --onproto: #1b1130;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --canvas: #06080b;
    --panel: #121923;
    --panel2: #1a222e;
    --line: #2a3646;
    --fg: #e1e8f0;
    --muted: #8e9cae;
    --accent: #5ba8f5;
    --onaccent: #04121f;
    --amber: #f5b041;
    --accentSoft: #142538;
    --amberSoft: #33270f;
    --danger: #f2706a;
    --shadow: rgba(0, 0, 0, 0.6);
    --proto: #e9e0ff;
    --onproto: #1b1130;
  }
  * {
    box-sizing: border-box;
  }
  body {
    background: var(--canvas);
    color: var(--fg);
    font: 13.5px/1.45 var(--sans);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 14px 90px;
  }
  .mono {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
  }
  .mut {
    color: var(--muted);
  }
  h1 {
    font-size: 16px;
    margin: 0;
    text-wrap: balance;
  }
  h2 {
    font-size: 14px;
    margin: 0;
  }
  h3 {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 6px;
  }
  .btn {
    font: inherit;
    font-size: 12.5px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--fg);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  .btn:hover {
    border-color: var(--accent);
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--onaccent);
  }
  .btn:disabled {
    opacity: 0.45;
    cursor: default;
  }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .top {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .top .sp {
    flex: 1;
  }
  .proto-note {
    font-size: 11.5px;
    background: var(--amberSoft);
    color: var(--fg);
    border-radius: 6px;
    padding: 3px 8px;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
  }
  .chip {
    font: inherit;
    font-size: 12px;
    border: 1px solid var(--line);
    background: var(--panel2);
    color: var(--fg);
    border-radius: 999px;
    padding: 3px 9px;
    cursor: pointer;
  }
  .chip.on {
    background: var(--accentSoft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .lbl {
    font-size: 11px;
    color: var(--muted);
    margin-right: 2px;
  }
  .main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 290px;
    gap: 12px;
    margin-top: 12px;
  }
  .main.withside {
    grid-template-columns: 340px minmax(0, 1fr) 270px;
  }
  @media (max-width: 1100px) {
    .main,
    .main.withside {
      grid-template-columns: minmax(0, 1fr);
    }
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    min-width: 0;
  }
  .tw {
    overflow-x: auto;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 12.5px;
  }
  th {
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: left;
    font-weight: 600;
    padding: 6px 8px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  td {
    padding: 6px 8px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  td.n {
    text-align: right;
    white-space: nowrap;
  }
  tr.grp td {
    background: var(--panel2);
    font-weight: 600;
    font-size: 12px;
  }
  .warn {
    color: var(--amber);
    font-weight: 600;
  }
  .approx {
    color: var(--amber);
  }
  .state dl {
    margin: 0;
    display: grid;
    gap: 8px;
  }
  .state dt {
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .state dd {
    margin: 2px 0 0;
    font-size: 12.5px;
  }
  .tag {
    display: inline-block;
    background: var(--panel2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0 5px;
    margin: 1px 2px 1px 0;
    font-size: 11.5px;
  }
  .ctx {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px;
    margin-top: 6px;
    background: var(--panel2);
  }
  .ctx textarea {
    width: 100%;
    font: inherit;
    font-size: 12.5px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--panel);
    color: var(--fg);
    padding: 4px;
    resize: vertical;
  }
  .explain {
    font-size: 12px;
    border-left: 3px solid var(--accent);
    padding: 4px 0 4px 10px;
    margin: 8px 0 0;
    color: var(--fg);
  }
  .explain b {
    font-weight: 600;
  }
  /* picker */
  dialog {
    border: 0;
    padding: 0;
    border-radius: 10px;
    background: var(--panel);
    color: var(--fg);
    box-shadow: 0 18px 50px var(--shadow);
    width: min(1080px, calc(100vw - 24px));
    max-height: calc(100vh - 24px);
  }
  dialog::backdrop {
    background: rgba(10, 14, 20, 0.45);
  }
  .pk {
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 24px);
  }
  .pk header,
  .pk footer {
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
  }
  .pk footer {
    border-top: 1px solid var(--line);
    border-bottom: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .pk footer .sp {
    flex: 1;
  }
  .pkb {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    gap: 0;
    min-height: 0;
    overflow: auto;
  }
  @media (max-width: 760px) {
    .pkb {
      grid-template-columns: minmax(0, 1fr);
    }
  }
  .mapw {
    background: var(--panel2);
    border-right: 1px solid var(--line);
    padding: 8px;
    min-width: 0;
  }
  .mapw svg {
    width: 100%;
    height: auto;
    display: block;
    max-height: 62vh;
  }
  .treew {
    padding: 10px 12px;
    overflow: auto;
    max-height: 66vh;
    min-width: 0;
  }
  /* tree */
  .tree {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .tree .tree {
    padding-left: 18px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 4px;
    border-radius: 4px;
    min-height: 26px;
  }
  .row:hover {
    background: var(--panel2);
  }
  .row.sel {
    background: var(--accentSoft);
    box-shadow: inset 0 0 0 1px var(--accent);
  }
  .row .tw2 {
    width: 16px;
    height: 16px;
    border: 0;
    background: none;
    color: var(--muted);
    cursor: pointer;
    padding: 0;
    font-size: 11px;
    flex: none;
  }
  .row .tw2.leaf {
    visibility: hidden;
  }
  .row input {
    margin: 0;
    flex: none;
    accent-color: var(--accent);
  }
  .row .nm {
    flex: 1;
    min-width: 0;
    cursor: default;
  }
  .row .nm.click {
    cursor: pointer;
  }
  .row .cnt {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    min-width: 2ch;
    text-align: right;
  }
  .row .part {
    font-size: 11px;
    color: var(--accent);
    white-space: nowrap;
  }
  .row.zero .nm,
  .row.zero .cnt {
    color: var(--muted);
    opacity: 0.65;
  }
  .row.zero .nm::after {
    content: " · sem lotes";
    font-size: 11px;
  }
  .row.special .nm {
    font-style: italic;
  }
  .row .hint {
    font-size: 11px;
    color: var(--muted);
    font-style: normal;
  }
  .more {
    font-size: 12px;
    color: var(--accent);
    background: none;
    border: 0;
    cursor: pointer;
    padding: 2px 4px 2px 26px;
    font: inherit;
    font-size: 12px;
  }
  .lvl-d > .row .nm {
    font-weight: 700;
  }
  .lvl-c > .row .nm {
    font-weight: 600;
  }
  /* map */
  .pin {
    cursor: pointer;
  }
  .pin circle.dot {
    fill: var(--accent);
    fill-opacity: 0.85;
    stroke: var(--panel);
    stroke-width: 2;
  }
  .pin.zero circle.dot {
    fill: var(--panel);
    fill-opacity: 1;
    stroke: var(--muted);
    stroke-dasharray: 3 3;
    stroke-width: 1.5;
  }
  .pin.on circle.ring {
    stroke: var(--fg);
    stroke-width: 3;
    fill: none;
  }
  .pin.half circle.ring {
    stroke: var(--fg);
    stroke-width: 3;
    fill: none;
    stroke-dasharray: 4 4;
  }
  .pin.sel circle.ring {
    stroke: var(--amber);
    stroke-width: 3;
    fill: none;
  }
  .pin text {
    font: 600 11px var(--sans);
    fill: var(--fg);
    text-anchor: middle;
    pointer-events: none;
  }
  .pin text.c {
    fill: var(--onaccent);
  }
  .pin.zero text.c {
    fill: var(--muted);
  }
  .pin.urg circle.dot {
    fill: var(--amber);
  }
  .pin:focus-visible {
    outline: none;
  }
  .pin:focus-visible circle.dot {
    stroke: var(--fg);
    stroke-width: 3;
  }
  .maplbl {
    font: 500 11px var(--sans);
    fill: var(--muted);
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    font-size: 11.5px;
    color: var(--muted);
    padding: 6px 4px 0;
  }
  /* side panel (C) */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 8px;
  }
  .tab {
    font: inherit;
    font-size: 12.5px;
    background: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    color: var(--fg);
  }
  .tab.on {
    background: var(--accentSoft);
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  .pend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    background: var(--amberSoft);
    border-radius: 6px;
    padding: 6px 8px;
    margin-top: 8px;
    font-size: 12px;
  }
  .pend .sp {
    flex: 1;
  }
  /* switcher */
  .sw {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    background: var(--proto);
    color: var(--onproto);
    border-radius: 999px;
    padding: 6px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 8px 24px var(--shadow);
    z-index: 50;
    max-width: calc(100vw - 32px);
  }
  .sw button {
    font: inherit;
    background: none;
    border: 0;
    color: inherit;
    font-size: 16px;
    cursor: pointer;
    padding: 2px 10px;
    border-radius: 999px;
  }
  .sw button:hover {
    background: rgba(127, 127, 127, 0.25);
  }
  .sw span {
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  @media (prefers-reduced-motion: reduce) {
    * {
      transition: none !important;
    }
  }
</style>

<nav class="sw" aria-label="Variantes do protótipo">

</nav>

      CONC.forEach((c) => {
        const cn = NODES.get("c:" + c.id);
        const sq = [cn.T, cn.U].filter((x) => cm.get(x));
        cn.children.forEach((id) => {
          const n = NODES.get(id),
            k = cm.get(id) || 0;
          if (!k && !S.showZero) return;
          const st = tickState(id, set),
            r = k ? 4 + Math.sqrt((sm.get(id) || 0) / 9000) : 3;
          pins += `<g class="pin${k ? "" : " zero"}${st.all ? " on" : ""}" data-pin="${id}" tabindex="0" role="checkbox" aria-checked="${st.all}" aria-label="${esc(n.n)}, ${k} lotes, ${eur(sm.get(id) || 0)}" transform="translate(${CX + n.x * PX} ${CY + n.y * PX})"><circle class="ring" r="${r + 3}" fill="none"/><circle class="dot" r="${r}"/>${k && r > 12 ? `<text y="${r + 12}">${esc(n.n.split(",")[0])}</text>` : ""}</g>`;
        });
        sq.forEach((id, i) => {
          const n = NODES.get(id),
            on = set.has(id),
            k = cm.get(id);
          pins += `<g class="pin${on ? " on" : ""}" data-pin="${id}" tabindex="0" role="checkbox" aria-checked="${on}" aria-label="${esc(label(id))}, ${k} lotes" transform="translate(${CX + n.x * PX + (i ? 12 : -12)} ${CY + n.y * PX - 16})"><rect x="-8" y="-8" width="16" height="16" rx="3" fill="var(--amber)" stroke="${on ? "var(--fg)" : "var(--panel)"}" stroke-width="${on ? 3 : 2}"/><text y="4" style="fill:var(--panel);font-size:10px">${n.kind === "T" ? "T" : "?"}</text></g>`;
        });
        pins += `<text class="maplbl" x="${CX + cn.x * PX}" y="${CY + cn.y * PX + 26}" text-anchor="middle">${esc(c.n)}</text>`;
      });
    }
    return `<svg viewBox="0 0 600 580" role="group" aria-label="Mapa estilizado da zona de Leiria">
   <rect width="600" height="580" fill="var(--panel2)"/>
   <path d="M0 0H95C80 120 120 220 85 330S60 480 95 580H0Z" fill="var(--accent)" opacity=".10"/>
   <circle cx="${CX}" cy="${CY}" r="${R}" fill="var(--accent)" fill-opacity=".04" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 6"/>
   ${S.dist < 50 ? `<circle cx="${CX}" cy="${CY}" r="${R2}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="2 4"/><text class="maplbl" x="${CX}" y="${CY - R2 - 4}" text-anchor="middle">filtro ${S.dist} km</text>` : ""}
   <text class="maplbl" x="${CX + R * 0.7}" y="${CY - R * 0.7 - 4}">raio 50 km</text>
   <g transform="translate(${CX} ${CY})"><path d="M0-9L9 0 0 9-9 0Z" fill="var(--fg)" stroke="var(--panel)" stroke-width="2"/></g>
   <text class="maplbl" x="${CX}" y="${CY + 22}" text-anchor="middle" style="fill:var(--fg)">Empresa</text>${pins}</svg>`;
  }
  function legendHTML() {
    const m = cfg().map;
    if (m.level === "c" && m.size === "count")
      return `<div class="legend"><span>● tamanho e número = lotes nos filtros atuais</span><span>○ tracejado = sem lotes</span><span>anel cheio = concelho todo escolhido; tracejado = parte</span></div>`;
    if (m.level === "f")
      return `<div class="legend"><span>● um ponto por freguesia; tamanho = valor anunciado somado</span><span><b style="color:var(--amber)">T</b> lotes com «Freguesia: Todas»</span><span><b style="color:var(--amber)">?</b> freguesia por identificar</span><span>locais sem lotes só com «Mostrar locais sem lotes»</span></div>`;
    return `<div class="legend"><span>● número = lotes; todos do mesmo tamanho</span><span style="color:var(--amber)">● âmbar = um prazo acaba em ≤ 3 dias</span><span>○ tracejado = sem lotes</span><span>clique seleciona para comentar (não filtra)</span></div>`;
  }
  function wireMap(root, set, repaint) {
    root.onclick = (e) => {
      const p = e.target.closest("[data-pin]");
      if (!p) return;
      const id = p.dataset.pin;
      if (cfg().tree.selMode === "split") {
        if (e.ctrlKey || e.metaKey) {
          S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id);
        } else S.sel = new Set([id]);
        S.anchor = id;
        repaint();
        return;
      }
      if (e.ctrlKey || e.metaKey) toggle(id, set);
      else {
        set.clear();
        leaves(id).forEach((x) => set.add(x));
      }
      repaint();
      $(`[data-pin="${id}"]`, root)?.focus();
    };
    root.onkeydown = (e) => {
      const p = e.target.closest("[data-pin]");
      if (!p) return;
      const id = p.dataset.pin;
      if (e.key === " ") {
        e.preventDefault();
        if (cfg().tree.selMode === "split") {
          S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id);
        } else toggle(id, set);
        repaint();
        $(`[data-pin="${id}"]`, root)?.focus();
      }
    };
  }

  /* ---------- diálogo (A, B) ---------- */
  function paintPk() {
    $("#pkTree").innerHTML = treeHTML(S.draft);
    wireTree($("#pkTree"), S.draft, paintPk);
    $("#pkMap").innerHTML = mapSVG(S.draft) + legendHTML();
    wireMap($("#pkMap"), S.draft, paintPk);
    const lv = LOTES.filter((l) => !l.warn && passOther(l) && S.draft.has(l.leaf)).length;
    $("#pkC").textContent = S.draft.size
      ? `Escolhidos: ${compress(S.draft).length} locais · ${lv} lotes`
      : "Nenhum local escolhido: a confirmar, entram todos";
    $("#pkCom").disabled = !S.draft.size;
  }
  function openPk() {
    S.draft = new Set(S.applied || []);
    if (!S.open.size) {
      ROOT.forEach((d) => S.open.add(d.id));
      if (S.v === "b") CONC.forEach((c) => S.open.add("c:" + c.id));
    }
    $("#pkHelp").textContent = cfg().help;
    paintPk();
    $("#pk").showModal();
  }
  $("#openPk").onclick = openPk;
  $("#pkNo").onclick = () => $("#pk").close();
  $("#pk").addEventListener("click", (e) => {
    if (e.target === $("#pk")) $("#pk").close();
  });
  $("#pkClr").onclick = () => {
    S.draft.clear();
    paintPk();
  };
  $("#pkOk").onclick = () => {
    S.applied = S.draft.size ? new Set(S.draft) : null;
    $("#pk").close();
    render();
  };
  $("#pkCom").onclick = () => {
    addCtx(compress(S.draft));
    paintPk();
  };

  /* ---------- painel lateral (C) ---------- */
  function paintSide() {
    const el = $("#side");
    const dirty =
      JSON.stringify([...S.draft].sort()) !== JSON.stringify([...(S.applied || [])].sort());
    el.innerHTML = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><h2 style="flex:1">Locais</h2>
    <button class="btn" id="cCom" ${S.sel.size ? "" : "disabled"}>Comentar ${S.sel.size ? "(" + S.sel.size + ")" : ""}</button></div>
    <div class="tabs"><button class="tab${S.cTab === "tree" ? " on" : ""}" data-tab="tree">Lista</button><button class="tab${S.cTab === "map" ? " on" : ""}" data-tab="map">Mapa</button></div>
    <div id="cBody"></div>
    ${dirty ? `<div class="pend"><span>${S.draft.size ? compress(S.draft).length + " locais marcados" : "Sem locais marcados"} · por aplicar</span><span class="sp"></span><button class="btn" id="cNo">Descartar</button><button class="btn primary" id="cOk">Aplicar</button></div>` : ""}
    <p class="explain">Caixa = filtro (vale com «Aplicar»; Escape descarta). Clique no nome = seleção para comentar (Ctrl/⌘ alterna, Shift intervalo).</p>`;
    const b = $("#cBody", el);
    if (S.cTab === "tree") {
      b.innerHTML = treeHTML(S.draft);
      wireTree(b, S.draft, paintSide);
    } else {
      b.innerHTML = `<div class="mapw" style="border:1px solid var(--line);border-radius:6px">${mapSVG(S.draft)}${legendHTML()}</div>`;
      wireMap(b, S.draft, paintSide);
    }
    $$("[data-tab]", el).forEach(
      (t) =>
        (t.onclick = () => {
          S.cTab = t.dataset.tab;
          paintSide();
        }),
    );
    $("#cCom", el).onclick = () => {
      addCtx([...S.sel]);
      S.sel.clear();
      paintSide();
    };
    const ok = $("#cOk", el),
      no = $("#cNo", el);
    if (ok)
      ok.onclick = () => {
        S.applied = S.draft.size ? new Set(S.draft) : null;
        render();
      };
    if (no)
      no.onclick = () => {
        S.draft = new Set(S.applied || []);
        render();
      };
    renderState();
  }
  document.addEventListener("keydown", (e) => {
    if (S.v === "c" && e.key === "Escape" && !e.target.closest("textarea")) {
      S.draft = new Set(S.applied || []);
      S.sel.clear();
      render();
    }
  });

  /* ---------- contexto (comentários) ---------- */
  function addCtx(ids) {
    if (!ids.length) return;
    S.ctx.push({ ids, text: "" });
    renderState();
    const t = $$("#state textarea");
    t[t.length - 1]?.focus();
  }

  /* ---------- tabela e estado ---------- */
  function where(l) {
    if (l.warn) return `<span class="warn">⚠ ${esc(l.warn)}</span>`;
    const n = NODES.get(l.leaf),
      c = NODES.get(n.parent),
      d = NODES.get(c.parent);
    const f =
      n.kind === "T"
        ? "Todas"
        : n.kind === "U"
          ? `<span class="approx">≈ ${esc(l.raw)}</span> <span class="mut">(por identificar)</span>`
          : esc(n.n);
    return `${esc(d.n)} / ${esc(c.n)} / ${f}`;
  }
  function render() {
    const isC = S.v === "c";
    $("#main").classList.toggle("withside", isC);
    $("#side").hidden = !isC;
    $("#openPk").hidden = isC;
    if (isC && !S.open.size) ROOT.forEach((d) => S.open.add(d.id));
    const L = listed().sort((a, b) => b.pub.localeCompare(a.pub));
    $("#count").textContent = L.length + " lotes";
    $("#locNote").innerHTML = S.applied ? "Local: " + tags(compress(S.applied)) : "";
    let h = `<thead><tr><th>Obra</th><th>Distrito / Concelho / Freguesia</th><th class="n">km</th><th class="n">Valor</th><th>Cat.</th><th>Publicado</th></tr></thead><tbody>`;
    const seen = new Set();
    L.forEach((l) => {
      if (l.g && !seen.has(l.g)) {
        seen.add(l.g);
        h += `<tr class="grp"><td colspan="6">▾ ${esc(l.t)}</td></tr>`;
      }
      h += `<tr><td>${l.g ? `<span class="mut">${l.lote}</span> · ${esc(l.o)}` : esc(l.t)}</td><td>${where(l)}</td><td class="n mono">${l.warn ? "—" : (NODES.get(l.leaf).kind === "U" ? "≈" : "") + l.dist}</td><td class="n mono">${eur(l.v)}</td><td>${esc(l.cat)}</td><td class="mono">${l.pub.slice(8, 10)}/${l.pub.slice(5, 7)}</td></tr>`;
    });
    if (!L.length)
      h += `<tr><td colspan="6" class="mut">Os filtros excluem todos os lotes.</td></tr>`;
    $("#tbl").innerHTML = h + "</tbody>";
    $("#swL").textContent = cfg().name;
    if (isC) paintSide();
    else renderState();
  }
  function renderState() {
    const c = cfg();
    $("#state").innerHTML = `<h3>Estado</h3><dl>
   <dt>Filtro de local aplicado</dt><dd>${S.applied ? tags(compress(S.applied)) : '<span class="mut">nenhum (todos os locais)</span>'}</dd>
   <dt>Escolha por confirmar</dt><dd>${tags(compress(S.draft))}</dd>
   ${c.tree.selMode === "split" ? `<dt>Locais selecionados (para comentar)</dt><dd>${tags([...S.sel])}</dd>` : ""}
   <dt>Contexto para o assistente</dt><dd>${S.ctx.length ? S.ctx.map((x, i) => `<div class="ctx">${tags(x.ids)}<textarea id="ctx${i}" data-i="${i}" rows="2" placeholder="Comentário sobre estes locais…">${esc(x.text)}</textarea></div>`).join("") : '<span class="mut">nenhum comentário</span>'}</dd>
  </dl><h3 style="margin-top:14px">O que esta variante decide</h3>${c.why.map(([k, v]) => `<p class="explain"><b>${k}:</b> ${esc(v)}</p>`).join("")}`;
    $$("#state textarea").forEach((t) => (t.oninput = () => (S.ctx[+t.dataset.i].text = t.value)));
  }

  /* ---------- filtros de topo ---------- */
  [50, 30, 20].forEach((d) =>
    $("#fDist").insertAdjacentHTML(
      "beforeend",
      `<button class="chip" data-d="${d}">${d} km</button>`,
    ),
  );
  [null, "1.ª", "2.ª", "3.ª", "5.ª", "Por classificar"].forEach((c) =>
    $("#fCat").insertAdjacentHTML(
      "beforeend",
      `<button class="chip" data-c="${c ?? ""}">${c ?? "Todas"}</button>`,
    ),
  );
  function paintChips() {
    $$("#fDist .chip").forEach((b) => b.classList.toggle("on", +b.dataset.d === S.dist));
    $$("#fCat .chip").forEach((b) => b.classList.toggle("on", (b.dataset.c || null) === S.cat));
  }
  $("#fDist").onclick = (e) => {
    const b = e.target.closest("[data-d]");
    if (!b) return;
    S.dist = +b.dataset.d;
    paintChips();
    render();
  };
  $("#fCat").onclick = (e) => {
    const b = e.target.closest("[data-c]");
    if (!b) return;
    S.cat = b.dataset.c || null;
    paintChips();
    render();
  };
  $("#clearAll").onclick = () => {
    S.dist = 50;
    S.cat = null;
    S.applied = null;
    S.draft.clear();
    S.sel.clear();
    paintChips();
    render();
  };

  /* ---------- troca de variante ---------- */
  const KEYS = ["a", "b", "c"];
  function go(k) {
    S.v = k;
    S.draft = new Set(S.applied || []);
    S.sel.clear();
    S.open.clear();
    S.showZero = false;
    if ($("#pk").open) $("#pk").close();
    if (location.hash !== "#" + k) history.replaceState(null, "", "#" + k);
    render();
  }
  const step = (d) => go(KEYS[(KEYS.indexOf(S.v) + d + KEYS.length) % KEYS.length]);
  $("#swP").onclick = () => step(-1);
  $("#swN").onclick = () => step(1);
  document.addEventListener("keydown", (e) => {
    if (e.target.closest("input,textarea,[contenteditable]") || $("#pk").open) return;
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
  });
  addEventListener("hashchange", () => {
    const k = location.hash.slice(1);
    if (KEYS.includes(k) && k !== S.v) go(k);
  });
  paintChips();
  go(KEYS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "a");
</script>
